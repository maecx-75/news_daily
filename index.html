<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Das Wichtigste des Tages</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0c0c0c;
            color: white;
            margin: 0;
            padding: 0;
        }
        .header {
            background-color: #b30000;
            padding: 20px;
            text-align: center;
            position: relative;
        }
        .header h1 {
            margin: 0;
            font-size: 2.5rem;
        }
        .ticker-container {
            background-color: #1a1a1a;
            padding: 10px;
            overflow: hidden;
            white-space: nowrap;
            border-bottom: 3px solid #b30000;
        }
        .ticker-text {
            display: inline-block;
            padding-left: 100%;
            animation: ticker 25s linear infinite;
            font-weight: bold;
            color: #ffcccc;
        }
        @keyframes ticker {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            padding: 20px;
            max-width: 1200px;
            margin: auto;
        }
        .card {
            background-color: #1c1c1c;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: transform 0.3s;
            text-decoration: none;
            color: white;
            display: flex;
            flex-direction: column;
        }
        .card:hover {
            transform: scale(1.02);
        }
        .card-img-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
        }
        .card img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .card-content {
            padding: 15px;
            flex-grow: 1;
        }
        .card h3 {
            margin: 0 0 10px 0;
            font-size: 1.2rem;
        }
        .card p {
            margin: 0;
            color: #aaaaaa;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Das Wichtigste des Tages</h1>
        <p>Die Top Nachrichten und das Wetter für Österreich</p>
    </div>

    <div class="ticker-container">
        <div id="ticker" class="ticker-text">Lade aktuelle Schlagzeilen...</div>
    </div>

    <div class="grid-container">
        <a id="news90_link" href="#" class="card" target="_blank">
            <div class="card-img-container">
                <img id="news90_img" src="news90.png" alt="Servus Nachrichten">
            </div>
            <div class="card-content">
                <h3 id="news90_title">Lade aktuelle Sendung...</h3>
                <p>Servus Nachrichten in 90 Sekunden</p>
            </div>
        </a>

        </div>

    <script>
        // Daten aus der headlines.json live ins Frontend laden
        fetch('headlines.json?t=' + new Date().getTime())
            .then(response => response.json())
            .then(data => {
                if(data.news90_link) {
                    document.getElementById('news90_link').href = data.news90_link;
                }
                if(data.news90_title) {
                    document.getElementById('news90_title').innerText = data.news90_title;
                }
                if(data.news90_image) {
                    document.getElementById('news90_img').src = data.news90_image;
                }
                if(data.ticker90) {
                    document.getElementById('ticker').innerText = data.ticker90;
                }
            })
            .catch(error => {
                print("[FEHLER] JSON konnte nicht geladen werden:", error);
                document.getElementById('news90_title').innerText = "Nachrichten temporär nicht verfügbar";
            });
    </script>

</body>
</html>
