name: Auto Update

on:
  schedule:
    # Triggert den Workflow mehrmals täglich (Beispiel: alle 3 Stunden)
    - cron: '0 */3 * * *'
  workflow_dispatch: # Ermöglicht das manuelle Starten über den GitHub-Actions-Tab

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Update News 90
        run: python scripts/update_news90.py

      # HIER IST DER REPARIERTE PUSH-SCHRITT MIT REBASE
      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add headlines.json news1920.json weather90.json tv_program.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto update (news, weather & program)" && git pull --rebase origin main && git push origin main)
