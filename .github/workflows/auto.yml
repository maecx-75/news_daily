name: Auto Update

on:
  schedule:
    # Einmal pro Stunde; so werden neue 90-Sekunden-Ausgaben zeitnah übernommen.
    - cron: '15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 playwright
          python -m playwright install --with-deps chromium

      - name: Run Update News 90
        run: python scripts/update_news90.py

      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add headlines.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto update news90" && git pull --rebase origin main && git push origin main)
