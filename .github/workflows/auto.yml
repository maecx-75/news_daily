name: Auto Update

on:
  schedule:
    - cron: "2,12,27,42,47,57 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 playwright yt-dlp ytdlp-servustv

      - name: Install Playwright browser
        run: python -m playwright install chromium

      # TEMPORÄR DEAKTIVIERT
      # - name: Update News 90
      #   run: python scripts/update_news90.py

      - run: python scripts/update_news1920.py
      - run: python scripts/update_google_headlines.py
      - run: python scripts/update_weather90.py
      - run: python scripts/update_tv_program.py

      - run: |
          git config user.name "bot"
          git config user.email "bot@github.com"
          git add .
          git commit -m "auto update" || exit 0
          git push
