name: Add Hüttenwirt tile

on:
  push:
    paths:
      - '.github/workflows/add_huettenwirt.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add Hüttenwirt tile
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          if 'id="huettenwirtTile"' in text:
              print('Hüttenwirt tile already exists.')
              raise SystemExit(0)

          tile = '''

            <!-- BLICKWECHSEL: KNOCHENJOB HÜTTENWIRT -->
            <a class="tile small" id="huettenwirtTile"
               href="https://www.servustv.com/de/page/AA81GB6LQLL09WAKXM8U?cid=3198c6e4-a594-4600-b0aa-415bbf6cda19"
               target="_blank" rel="noopener noreferrer"
               data-share-url="https://www.servustv.com/de/page/AA81GB6LQLL09WAKXM8U?cid=3198c6e4-a594-4600-b0aa-415bbf6cda19"
               style="background-image:url('huettenwirt.jpg')">
              <div class="tile-actions">
                <button class="action-btn like-btn" data-like-key="tile-huettenwirt" onclick="toggleLike(event, this)">♡ Like</button>
                <button class="action-btn" onclick="shareTile(event, this.closest('.tile'))">↗ Teilen</button>
              </div>
              <div class="overlay">
                <h2>Knochenjob: Ein Tag als Hüttenwirt</h2>
                <div class="sub">BLICKWECHSEL. Das Nachrichtenmagazin</div>
              </div>
            </a>
          '''

          marker = '\n</div>\n</main>'
          pos = text.find(marker)
          if pos == -1:
              raise RuntimeError('Kachelraster in index.html nicht gefunden')

          text = text[:pos] + tile + text[pos:]
          p.write_text(text, encoding='utf-8')

      - name: Commit index
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add Hüttenwirt tile"
          git push
